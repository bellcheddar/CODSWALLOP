<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CODSWALLOP">
  <!-- Brass on slate, matching the theme: the drawer front is physical, so it is warm;
       the constellation inside it is data, so it is cool. -->
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9A063"/>
      <stop offset="1" stop-color="#8A6D40"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="13" fill="#131924"/>
  <rect x="8.5" y="12.5" width="47" height="39" rx="5" fill="#0F1522" stroke="url(#brass)" stroke-width="2.4"/>
  <!-- the plate -->
  <rect x="23" y="17.5" width="18" height="5" rx="1.6" fill="url(#brass)"/>
  <!-- the constellation: cool, and the brightest node is the seed at the centre -->
  <circle cx="32" cy="35.5" r="4.2" fill="#5B8CFF"/>
  <circle cx="20"   cy="30"   r="2.5" fill="#4FD1E3"/>
  <circle cx="44.5" cy="30.5" r="2.1" fill="#4FD1E3"/>
  <circle cx="24"   cy="44"   r="1.9" fill="#F5B93F"/>
  <circle cx="42"   cy="43.5" r="2.6" fill="#9B7BE8"/>
  <g stroke="#2E3A4E" stroke-width="1.2">
    <line x1="32" y1="35.5" x2="20"   y2="30"/>
    <line x1="32" y1="35.5" x2="44.5" y2="30.5"/>
    <line x1="32" y1="35.5" x2="24"   y2="44"/>
    <line x1="32" y1="35.5" x2="42"   y2="43.5"/>
  </g>
  <!-- the drawer pull -->
  <rect x="26" y="55" width="12" height="2.6" rx="1.3" fill="url(#brass)" opacity=".7"/>
</svg>
