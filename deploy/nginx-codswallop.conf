# nginx site for CODSWALLOP. provision.sh substitutes __SERVER_NAME__ and __BIND_ADDR__ and
# installs this to /etc/nginx/sites-available/codswallop, then `certbot --nginx` adds the TLS
# block and the port-80 redirect, and provision.sh patches HTTP/2 in afterwards.

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # No uploads: the only thing a reader ever sends is a query string. Keep the body small
    # so a stray POST is rejected by nginx rather than occupying a gunicorn worker.
    client_max_body_size 1m;

    location /static/ {
        alias /opt/codswallop/codswallop/static/;

        # Shared snippet: the immutable long-cache header, and the comment explaining why
        # `access_log off;` must NOT be added here. mdeller.com counts a hit for this app by
        # watching for a request only a rendering browser makes; with logging off that
        # traffic is invisible and the count reads zero forever with nothing to show why.
        include /etc/nginx/snippets/long-cache.conf;

        # Tabulator is 430 kB and the three self-hosted font families another 240 kB, all of
        # it highly compressible. woff2 is already compressed and is deliberately absent
        # from gzip_types: gzipping it burns CPU to make the file marginally larger.
        gzip on;
        gzip_types text/css text/javascript application/javascript image/svg+xml;
        gzip_min_length 1024;
    }

    location / {
        proxy_pass http://__BIND_ADDR__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A cold family is a sequence search plus tens of batched GraphQL calls against
        # someone else's API. MUST stay at or above `timeout` in deploy/gunicorn.conf.py, or
        # nginx returns 504 on exactly the long builds gunicorn was about to finish and
        # cache for a week.
        proxy_read_timeout 720s;
        proxy_send_timeout 720s;

        # An assembled family is ~1.7 MB of JSON that gzips to about 240 kB, and it is the
        # single biggest thing this app sends. Compressing proxied responses is off by
        # default in nginx, so without this line every reader downloads the full 1.7 MB.
        gzip on;
        gzip_proxied any;
        # text/html is deliberately absent: nginx always gzips it and listing it here is a
        # duplicate that `nginx -t` warns about ("duplicate MIME type").
        gzip_types application/json text/css application/javascript;
        gzip_min_length 1024;
    }
}
