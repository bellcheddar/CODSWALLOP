[pytest]
# pythonpath rather than an editable install: `pip install -e .` silently does nothing on
# this Mac under Python 3.14, because site.py skips .pth files in a hidden directory.
pythonpath = .
testpaths = tests
addopts = -q --strict-markers
markers =
    network: hits a live public API (deselect with -m "not network")
